name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wayfarer
          POSTGRES_PASSWORD: wayfarer
          POSTGRES_DB: wayfarer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wayfarer -d wayfarer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://wayfarer:wayfarer@localhost:5432/wayfarer
      TEST_DATABASE_URL: postgres://wayfarer:wayfarer@localhost:5432/wayfarer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:init
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
