services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wayfarer
      POSTGRES_PASSWORD: wayfarer
      POSTGRES_DB: wayfarer
    ports:
      - '${WAYFARER_DB_PORT:-5432}:5432'
    volumes:
      - wayfarer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wayfarer -d wayfarer']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  wayfarer-pgdata:
